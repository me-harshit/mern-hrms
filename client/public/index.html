<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Icons. All point at the GTS mark; the stock Create React App logos that
       used to sit here are what WhatsApp was showing in link previews. -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <meta name="theme-color" content="#215D7B" />
  <meta name="description" content="GTS HRMS — employee, attendance, leave and task management." />

  <title>HRMS GTS</title>

  <!--
    Open Graph / Twitter tags.

    WhatsApp, Slack and every other link previewer reads these when a URL is
    pasted. With none of them present the crawler falls back to guessing an
    icon — which is how the stock React logo ended up in people's chats.

    og:image MUST be an absolute URL. A relative path is silently ignored by
    most crawlers, including WhatsApp's, and you are back to the fallback.

    These are static and deliberately generic. Every HRMS page is behind a
    login and the crawler only ever receives this shell, so a preview can never
    describe the actual page — and it should not: a task title leaking into a
    WhatsApp preview is a small privacy hole, not a feature.
  -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="GTS HRMS" />
  <meta property="og:title" content="GTS HRMS" />
  <meta property="og:description" content="Employee, attendance, leave and task management." />
  <meta property="og:url" content="https://hrm.gts.ai/" />
  <meta property="og:image" content="https://hrm.gts.ai/favicon.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:image:alt" content="GTS HRMS" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="GTS HRMS" />
  <meta name="twitter:description" content="Employee, attendance, leave and task management." />
  <meta name="twitter:image" content="https://hrm.gts.ai/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
