# /etc/nginx/sites-available/default  —  GTS Portal
#
# Kept in the repo because the deployment was previously reproducible only from
# the live box. Copy up, `nginx -t`, then `systemctl reload nginx`.
#
# Certbot lineage is named `hrm.gts.ai` and covers both hostnames. The name is
# cosmetic; renaming the lineage would break the renewal timer for no gain.

# --- Primary: the app ---------------------------------------------------------
server {

    server_name portal.gts.ai 163.245.209.108;

    client_max_body_size 512M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    root /var/www/mern-hrms/client/build;
    index index.html;

    location /uploads/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hrm.gts.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hrm.gts.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# --- Old hostname -> new ------------------------------------------------------
# 302, not 301, while the migration beds in: a 301 is cached by browsers
# permanently and cannot be withdrawn if you need to back out. Promote to 301
# after roughly a week of clean running, then retire this block at the 90-day
# mark (see PORTAL-MIGRATION-PLAN.md, Stage 8).
server {
    listen 443 ssl;
    server_name hrm.gts.ai;

    ssl_certificate /etc/letsencrypt/live/hrm.gts.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrm.gts.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 302 https://portal.gts.ai$request_uri;
}

# --- Port 80 -> HTTPS (certbot-managed; left untouched) -----------------------
server {
    if ($host = portal.gts.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = hrm.gts.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;

    server_name hrm.gts.ai portal.gts.ai 163.245.209.108;
    return 404; # managed by Certbot




}
